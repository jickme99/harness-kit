name: tests
# TEMPLATE — copy to `.github/workflows/tests.yml`; the only project-specific line is the extras in the install
# step. The job MUST be named `tests`: that is the status check branch protection requires. From a
# live app (2026-09-11). Phase A of the two-lanes plan: the whole suite runs in GitHub on every push to main and every pull
# request, so "green" is a machine fact on the change itself, not a report from the maintainer's workstation.
# No Azure: the suite runs on the local adapters. The Dockerfile guard test (tests/test_dockerfile_policy.py)
# rides along, so the "no pip in the runtime image" block is checked on every change. The job is named
# `tests` because that name is the status check branch protection requires before a merge.
#
# Actions pinned to full commit SHAs (security lens F2 of the freshness plan): a tag is a mutable pointer.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read      # the list of files a pull request touches (the image-build step below)

# One run per ref at a time; a newer push cancels the older run of the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app with its extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"      # add the extras your app declares
          python -c "import sys; print(sys.version)"

      # To a file, exit code read by hand (lesson #159): a pipe's exit code belongs to the last command.
      # `set +e` on purpose: GitHub runs the step under `bash -e`, so pytest's own non-zero exit would end
      # the script before the tail and the page are written (lesson #186: the step died silent).
      - name: Run the whole suite
        run: |
          set +e -uo pipefail
          python -m pytest tests -q -p no:cacheprovider -rf --durations=15 > pytest.txt 2>&1
          rc=$?
          tail -n 40 pytest.txt
          echo "PYTEST EXIT $rc"
          {
            echo "## tests"
            echo
            echo '```'
            tail -n 25 pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Phase D follow-through (lesson #189): the suite installs from pyproject's floors, so it cannot see a
      # lock that no longer resolves — a lone bump of one half of an exact-pinned pair
      # was green here and unbuildable in the registry, because the other package pins that
      # version exactly. The lock's
      # consumer is the image build, so a pull request that touches the Dockerfile, a lock file or the
      # manifest builds the image HERE, on the runner, with the same base and the same --require-hashes
      # installs. Pushes to main skip it: a deploy builds anyway, and a pull request is where a merge is
      # decided — this step is what stops an unbuildable lock from merging itself.
      - name: Prove the image builds from the lock (pull requests touching the Dockerfile, a lock file or the manifest)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_IMAGE: mcr.microsoft.com/azurelinux/base/python:3.12
        run: |
          set -euo pipefail
          CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if ! printf '%s\n' "$CHANGED" | grep -Eq '^(Dockerfile|requirements-lock\.txt|requirements-toolchain\.txt|requirements-image\.in|requirements-toolchain\.in|pyproject\.toml)$'; then
            echo "no Dockerfile, lock or manifest change in this pull request — the image build is not needed here"
            exit 0
          fi
          echo "this pull request touches the image's inputs — building it from the lock:"
          printf '%s\n' "$CHANGED" | grep -E '^(Dockerfile|requirements-.*|pyproject\.toml)$' | sed 's/^/  /'
          docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -t lock-check:pr . > docker-build.txt 2>&1 || { tail -n 60 docker-build.txt; echo "REFUSED: the image does not build from this lock (the tail of the build log is above)."; exit 1; }
          tail -n 5 docker-build.txt
          echo "the image builds from this lock (every --require-hashes install resolved)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the full pytest output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: pytest-${{ github.run_id }}
          path: pytest.txt
          retention-days: 14
          if-no-files-found: warn
